# run_tldmon_bench.conf.example
# Copy this file, fill in your values, and pass it to the script:
#   ./run_tldmon_bench_vcu118.sh my_experiment.conf
#
# ---- Required ----------------------------------------------------------------

# Workload IDs for the two parallel benchmarks.
# Valid values:
#   0/none      — no workload (single-workload mode when used as WL2_ID)
#   1/omnetpp   — 520.omnetpp_r_run_ref
#   2/mcf_r     — 505.mcf_r_run_ref
#   3/mcf_s     — 605.mcf_s_run_ref
#   4/perlbench — 500.perlbench_r_run_train
#   5/memtest   — memtest_dir/memtest
#   6/stream    — l2_stream_stress (L2 cache streaming stress, requires
#                 ./l2_stream_stress binary in the working directory;
#                 optionally set STREAM_BUF_MB and STREAM_PASSES below)
WL1_ID=1      # 520.omnetpp_r_run_ref
WL2_ID=6      # 500.perlbench_r_run_train

# Total wall-clock time to run the benchmarks (seconds).
RUN_SECS=600

# ---- Sampling window ---------------------------------------------------------

# How long to let the benchmarks warm up before starting the monitors.
# Set to 0 to start sampling immediately (original behaviour).
# Example: 1800 = start sampling at the 30-minute mark.
SAMPLE_DELAY_SECS=360

# How long (seconds) to actually record monitor data.
# The TLD/SAT interval is computed from this value so you get fine-grained
# snapshots even for a short window.
# Example: 10 = 10-second window → ~9.77 ms per snapshot at 1024 depth / 50 MHz.
# If omitted, defaults to (RUN_SECS - SAMPLE_DELAY_SECS).
SAMPLE_DURATION_SECS=10

# ---- Output ------------------------------------------------------------------

# Base filename for TLDMON output.  SAT output is derived automatically as
# <OUTFILE stem>_sat.txt.
# If left unset, the filename is auto-generated from the config params:
#   tlmon_<wl1>_<wl2>_<RUN_SECS>_<LO>_<HI>[_d<delay>_w<duration>].txt
# e.g.  tlmon_520_500_600_10_20_d360_w10.txt
# Uncomment and set to override:
OUTFILE="single_core_256K16W_tlmon_l2_stream_stress_600_5_10_d0_w600.txt"

# ---- TLD / SAT thresholds ---------------------------------------------------

# Cache-set count (csc) boundaries for activity buckets:
#   idle:  csc == 0
#   cold:  1  <= csc < TLD_THRESH_LO
#   warm:  TLD_THRESH_LO <= csc < TLD_THRESH_HI
#   hot:   TLD_THRESH_HI <= csc <= 15
TLD_THRESH_LO=10
TLD_THRESH_HI=20

# ---- CPU pinning ------------------------------------------------------------

# CPU cores for taskset pinning (requires isolcpus=1,2,… in kernel cmdline
# on VCU118 to keep the OS scheduler off these cores).
CPU_AFF1=0
CPU_AFF2=1

# ---- Stream stress options (only used when WL1_ID=6/stream or WL2_ID=6/stream) --

# Working-set buffer size in MiB (default: 8).  Should be >> 0.25 MiB (L2 size).
STREAM_BUF_MB=12

# Number of full read+write sweeps (default: 10).  Set high for a long run.
STREAM_PASSES=1000
